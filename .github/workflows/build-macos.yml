name: Build macOS Cut and Worker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: 'Attach archives to a published release (otherwise artifacts only)'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag; empty selects the latest published release'
        type: string
        default: ''
      publish_from_run:
        description: 'Optional run ID: attach its completed ZIPs without building or repackaging'
        type: string
        default: ''
      package_from_run:
        description: 'Optional failed run ID: repackage preserved executables without building'
        type: string
        default: ''
      package_version:
        description: 'Original binary version, required when reusing a run (e.g. 0.10.0)'
        type: string
        default: ''
  # The manual entry points call this workflow so build/recovery logic stays shared.
  workflow_call:
    inputs:
      product:
        type: string
        default: both
      attach_to_release:
        type: boolean
        default: true
      release_tag:
        type: string
        default: ''
      publish_from_run:
        type: string
        default: ''
      package_from_run:
        type: string
        default: ''
      package_version:
        type: string
        default: ''

permissions:
  contents: write
  actions: read

# Shared by all three entry points. Callers deliberately have no second lock.
concurrency:
  group: pleochroma-macos-build
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Resolve products and release destination
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      mode: ${{ steps.plan.outputs.mode }}
      source_run: ${{ steps.plan.outputs.source_run }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate inputs and pin release destination before building
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product || 'both' }}
          ATTACH_TO_RELEASE: ${{ inputs.attach_to_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_FROM_RUN: ${{ inputs.package_from_run }}
          PUBLISH_FROM_RUN: ${{ inputs.publish_from_run }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: python3 scripts/prepare-macos-workflow.py

  build:
    name: ${{ matrix.product }} macOS ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      PRODUCT: ${{ matrix.product }}
      RUST_TARGET: ${{ matrix.target }}
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: '1'
      CARGO_TARGET_DIR: target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      RUSTC_WRAPPER: ''
      RUSTC_WORKSPACE_WRAPPER: ''
      # Keep Apple's ARM64 baseline; Intel overrides the workspace AVX2 baseline.
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      SLINT_NO_QT: '1'
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      MODE: ${{ needs.prepare.outputs.mode }}
      SOURCE_RUN: ${{ needs.prepare.outputs.source_run }}
      ARCHIVE_NAME: ${{ matrix.archive }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Re-run jobs uses the old SHA. Start a new run on the updated branch for fixes.
      - name: Check packaging before compiling
        if: env.MODE != 'publish'
        run: |
          echo "Source commit: $(git rev-parse HEAD)"
          shasum -a 256 scripts/package-macos.sh
          bash -n scripts/package-macos.sh
          bash scripts/package-macos.sh --preflight "$RUST_TARGET" "$APP_VERSION" "$PRODUCT"

      - name: Install Rust toolchain and inspect native SDK
        if: env.MODE == 'build'
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$RUST_TARGET"
          rustc --version
          xcrun --find clang
          xcrun --sdk macosx --show-sdk-path

      - name: Build the selected product with one Cargo worker
        if: env.MODE == 'build'
        env:
          BUILD_FEATURES: ${{ matrix.features }}
        run: |
          unset CARGO_ENCODED_RUSTFLAGS
          # Match the Linux pgo-bolt-build.sh GPU production feature set.
          # UI harnesses, benchmarks and experimental color UI are not release features.
          cargo build --locked --release --jobs 1 \
            -p "pleochroma-$PRODUCT" --bin "pleochroma-$PRODUCT" \
            --features "$BUILD_FEATURES" --target "$RUST_TARGET"

      - name: Download preserved executable
        if: env.MODE == 'package'
        uses: actions/download-artifact@v8
        with:
          name: pleochroma-${{ matrix.product }}-${{ matrix.arch }}-unpackaged
          run-id: ${{ needs.prepare.outputs.source_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/macos-recovery

      - name: Restore preserved executable without rebuilding
        if: env.MODE == 'package'
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import tarfile
          from pathlib import Path

          binary = "pleochroma-" + os.environ["PRODUCT"]
          target = os.environ["RUST_TARGET"]
          archive_path = Path(os.environ["RUNNER_TEMP"]) / "macos-recovery" / f"{binary}-{target}-unpackaged.tar.gz"
          destination = Path(os.environ["CARGO_TARGET_DIR"]) / target / "release" / binary
          destination.parent.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive_path, "r:gz") as archive:
              member = archive.getmember(binary)
              if not member.isfile():
                  raise ValueError("Preserved executable must be a regular file, not a link")
              with archive.extractfile(member) as source, destination.open("wb") as output:
                  shutil.copyfileobj(source, output)
          destination.chmod(0o755)
          PY

      - name: Package unsigned application
        if: env.MODE != 'publish'
        id: bundle
        run: |
          echo "Packaging source commit: $(git rev-parse HEAD)"
          shasum -a 256 scripts/package-macos.sh
          bash -x scripts/package-macos.sh "$RUST_TARGET" "$APP_VERSION" "$PRODUCT"

      - name: Download completed ZIP without rebuilding
        if: env.MODE == 'publish'
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.archive }}
          run-id: ${{ needs.prepare.outputs.source_run }}
          github-token: ${{ github.token }}
          path: dist
          # Previous builds upload a raw ZIP with archive:false. Preserve its bytes.
          skip-decompress: true

      - name: Verify archive selected for publication
        id: archive
        run: python3 scripts/verify-macos-archive.py

      - name: Archive executable if packaging or archive verification fails
        if: failure() && env.MODE != 'publish' && (steps.bundle.outcome == 'failure' || steps.archive.outcome == 'failure')
        run: |
          tar -czf "$RUNNER_TEMP/pleochroma-$PRODUCT-$RUST_TARGET-unpackaged.tar.gz" \
            -C "$CARGO_TARGET_DIR/$RUST_TARGET/release" "pleochroma-$PRODUCT"

      - name: Preserve executable if packaging or archive verification fails
        if: failure() && env.MODE != 'publish' && (steps.bundle.outcome == 'failure' || steps.archive.outcome == 'failure')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pleochroma-${{ matrix.product }}-${{ matrix.arch }}-unpackaged
          path: ${{ runner.temp }}/pleochroma-${{ matrix.product }}-${{ matrix.target }}-unpackaged.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload architecture-specific archive
        if: env.MODE != 'publish'
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ steps.archive.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Attach archive to the resolved release
        if: needs.prepare.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"
          printf 'Attached `%s` to release `%s`.\n' "$ARCHIVE_NAME" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
