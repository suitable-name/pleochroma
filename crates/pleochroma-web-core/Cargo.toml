[package]
name = "pleochroma-web-core"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
description = "The compute side of the pleochroma browser app with no DOM or Slint in it: the Web Worker protocol, the scene spec that builds the desktop's exact render scene, the CPU chunk tracer, pass accumulation and chunk planning, the worker-side solve, and (wasm32 only) the host-side Worker pool the UI calls."
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = "https://docs.rs/pleochroma-web-core"
keywords = ["gemstone", "faceting", "wasm", "webworker", "rendering"]
categories = ["wasm", "rendering"]
publish = { workspace = true }

[dependencies]
# The spectral tracer (`renderer::cpu_frame`, `renderer::frame_scene`), the shared
# render setup (`render_setup::*`) and, through `hdr`, the one `.hdr` decoder every
# node uses (`renderer::env_map::environment_from_hdr_bytes`). No `gpu`: the browser
# renders on CPU Web Workers (compiling the megakernel takes Chrome's GPU process
# down). `serde`: the session's custom
# `GemMaterial`s travel inside `scene::MaterialSpec` as they are (the page holds them as
# built materials, not as the snapshots they came from).
pleochroma = { workspace = true, features = ["hdr", "serde"] }
# `Design`, the native TOML load/save pair and `MaterialSelection` -- the solve worker's
# design transport and the linked-material override.
pleochroma-cut-core = { workspace = true }
# `CustomMaterialSnapshot`, the native file's custom-material fields.
pleochroma-formats = { workspace = true }
# The solve policy (`solve_cancellably`, the plane-cap diagnosis) and the view-model
# helpers the solve worker formats its status and warnings with, plus
# `traced_gem_material` for the linked-material override.
pleochroma-editor = { workspace = true }
# `cut_position::CutPosition`, the Cut slider's position vocabulary shared with the desktop
# (`cut_slider`). Already in the graph through `pleochroma-editor`; it is pure Rust and builds
# for wasm32.
pleochroma-solid = { workspace = true }
# The browser design library's record shapes, importer and search (`library_record`,
# `library_measure`, `library_view`): the vault's `model` and `local` modules only. A direct
# path dependency, not `workspace = true`: the workspace entry keeps the default `sqlite`
# feature on, and a member cannot switch it off. Without it the vault is pure Rust (no C
# SQLite) and builds for wasm32. Nothing else in the wasm graph may depend on the vault with
# default features, or Cargo feature unification turns `sqlite` back on.
pleochroma-vault = { path = "../pleochroma-vault", default-features = false }
glam = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
# `settings::SessionPayload`'s JSON form (the page's `sessionStorage` entry).
serde_json = { workspace = true }
# `storage_keys::sha256_hex`: the text-hash stone key of a design without an id (the
# cutting marks' key rule, shared with the Android app). Pure Rust, builds for wasm32.
sha2 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The host-side Worker pool (`host` module): spawning Workers, `postMessage` with a
# transferred `ArrayBuffer`, timers for the solve timeout.
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", default-features = false, features = ["Blob", "ErrorEvent", "MessageEvent", "Navigator", "Performance", "Url", "Window", "Worker", "console"] }
# The one-shot channel behind `SolveClient::solve`'s future. Already in the graph
# (`pleochroma`'s own wasm32 arm uses it), so this adds nothing to `Cargo.lock`.
futures-channel = { version = "0.3.34", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# `renderer::gpu::hybrid::cpu_accumulate`, the desktop's CPU estimator, is the
# reference the render recombination test checks against. It lives behind `gpu`, so
# the native test build turns that on; the library itself never does.
pleochroma = { workspace = true, features = ["gpu", "hdr"] }

[features]
default = []

[lints]
workspace = true
