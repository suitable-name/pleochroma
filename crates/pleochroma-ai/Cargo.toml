[package]
name = "pleochroma-ai"
version = "0.10.0"
edition = "2024"
rust-version = "1.95"
authors = ["Suitable-Name"]
license = "MIT"
publish = false
description = "Reinforcement learning environments, neural policy models, and inference pipelines for gemstone cut optimization and material retargeting."

[features]
default = []
cuda = ["burn/cuda", "dep:cudarc"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_precision_loss = { level = "allow" }
cast_sign_loss = { level = "allow" }
cast_possible_wrap = { level = "allow" }
cast_possible_truncation = { level = "allow" }
float_cmp = { level = "allow" }
inline_always = { level = "allow" }
implicit_hasher = { level = "allow" }
struct_excessive_bools = { level = "allow" }
result_large_err = { level = "allow" }
similar_names = { level = "allow" }

[dependencies]
pleochroma = { path = "../pleochroma" }
pleochroma-cut-core = { path = "../pleochroma-cut-core" }
pleochroma-editor = { path = "../pleochroma-editor" }
glam = "=0.34.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
rayon = "1.12.0"
burn = { version = "0.22.0", features = ["autodiff", "flex", "wgpu"] }
cudarc = { version = "=0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-version-from-build-system", "fallback-latest"] }

[dev-dependencies]
divan = "0.1.21"

[[bench]]
name = "env_step"
harness = false
