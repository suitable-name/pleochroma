# Built-in color variants: beryl (Emerald, Aquamarine, Morganite), Topaz, Tourmaline, Andalusite.
# Schema: see ../color_variants.toml. Research: docs/color_variants/R2_beryl_topaz_tourmaline_andalusite.md.
# Fit record (bands, scaling, targets, reached colors): docs/color_variants/fit_records/beryl_topaz_tourmaline_andalusite.md.
# Every entry is per_mm (peak = Napierian absorption coefficient in mm^-1, sigma of the energy Gaussians in cm^-1)
# calibrated for the face-up path of a 7 mm stone (9.905 mm, see the fit record). o_ray / e_ray are E perpendicular /
# parallel to c for the uniaxial hosts (beryl, tourmaline); alpha / gamma / beta_ray = beta for the biaxial hosts
# (topaz: alpha = E parallel a, gamma = E parallel c; andalusite: alpha = E parallel c, gamma = E parallel a).
#
# Estimated flag (one rule for every data file): `estimated = true` when the spectrum shape is NOT a measured
# spectrum of that variety, OR the strength is NOT anchored (no concentration, no published color value, a factor
# chosen for how the variety looks). `estimated = false` only for a measured spectrum at a strength that a published
# number fixes. The FIRST line of `sources` is one short plain sentence saying which part is estimated: the UI shows it
# as the "Estimated" tooltip. The full citations follow on the later lines.

data_version = 1

[[variant]]
material = "Emerald"
key = "emerald.zambian"
label = "Zambian"
unit = "per_mm"
reference_path_mm = 7.0
estimated = true
