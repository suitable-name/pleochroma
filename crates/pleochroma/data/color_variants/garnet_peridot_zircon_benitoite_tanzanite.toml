# Built-in color variants: garnet peridot zircon benitoite tanzanite (fit lane F3, 2026-10-27).
# Schema: see ../color_variants.toml. Research: docs/color_variants/R3_garnet_peridot_zircon_benitoite_tanzanite.md.
# Fit records: docs/color_variants/fit_records/garnet_peridot_zircon_benitoite_tanzanite.md (one section per entry).
#
# Every entry is `per_mm` (Napierian absorption coefficient per millimetre of path) and calibrated for a 7 mm stone,
# whose face-up light path is MODEL_UNIT_FACE_UP_PATH x 7 / REFERENCE_MODEL_WIDTH = 2.83 x 7 / 2 = 9.905 mm
# (`variants::face_up_swatch_path`). The garnets are cubic: one band set, stored twice (o = e), `pleochroic = false`.
# Peridot and tanzanite are biaxial (o = alpha, beta, e = gamma), zircon and benitoite uniaxial (o = E perp c,
# e = E parallel c). All bands are energy Gaussians (width_nm = sigma in cm^-1 = FWHM / 2.35482).
# Bands of the data fits are empirical: bands below about 440 nm describe the ultraviolet edge, and
# individual centres are not assigned unless the fit record says so.
#
# Estimated flag (one rule for every data file): `estimated = true` when the spectrum shape is NOT a measured
# spectrum of that variety, OR the strength is NOT anchored (no concentration, no published color value, a factor
# chosen for how the variety looks). `estimated = false` only for a measured spectrum at a strength that a published
# number fixes. The FIRST line of `sources` is one short plain sentence saying which part is estimated: the UI shows it
# as the "Estimated" tooltip. The full citations follow on the later lines.

data_version = 1

# Pyrope Garnet, Rhodolite: Fe2+ on the dodecahedral site (spin-forbidden 504, 527-530, 576 nm, weak 610 and 690 nm), a rising ultraviolet edge and a broad Fe2+-Fe3+ continuum. About 33 mol% almandine, inside the rhodolite range.
# Fit record: docs/color_variants/fit_records/garnet_peridot_zircon_benitoite_tanzanite.md#f3-01-pyrope-garnet-rhodolite
[[variant]]
material = "Pyrope Garnet"
key = "pyrope_garnet.rhodolite"
label = "Rhodolite"
unit = "per_mm"
reference_path_mm = 7.0
estimated = true
sources = [
  "Strength chosen for a typical face-up color; spectrum measured (GRR 131 rhodolite).",
  "Caltech Mineral Spectroscopy Server (G. R. Rossman, CC BY-NC 4.0, DOI 10.7907/jywr-qq57): GRR 131 rhodolite (Mg1.82 Fe0.99 Ca0.16 Mn0.04 Al2.00, 2.007 mm), http://minerals.gps.caltech.edu/FILES/Visible/garnet/grr131, crates/pleochroma/data/reference_spectra/variant_pyrope_rhodolite_iso.csv; GRR 83 (Umba) agrees per almandine fraction",
  "docs/color_variants/R3_garnet_peridot_zircon_benitoite_tanzanite.md, section 2.1.1 (Fe2+ 504 / 527 / 576 nm over a UV edge, Fe2+-Fe3+ IVCT continuum; Fe2+-Fe3+ IVCT band near 21 700 cm^-1 in Fe-rich garnets: Taran, Dyar and Matsyuk 2007, Am. Mineral. 92, 753-760 (the DOI formerly cited here could not be verified and is dropped))",
]
