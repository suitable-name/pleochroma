# Built-in color variants: corundum, spinel, chrysoberyl, alexandrite (Sapphire, Ruby, Spinel,
# Chrysoberyl (Yellow), Alexandrite). Schema: see ../color_variants.toml. Research:
# docs/color_variants/R1_corundum_spinel_chrysoberyl.md. Fit records:
# docs/color_variants/fit_records/corundum_spinel_chrysoberyl.md (one section per entry).
#
# Every entry is PerMm at reference_path_mm = 7.0 (the stone width). The peaks are the face-up optical
# depth of the fitted spectrum divided by the face-up path of a 7 mm stone, MODEL_UNIT_FACE_UP_PATH x
# 7 / 2.0 = 9.905 mm (variants::face_up_swatch_path), so a peak times 9.905 is the face-up optical depth
# the Sapphire / Ruby / Spinel Material Defaults carry as a model-unit peak. Widths are sigma in cm^-1
# (FWHM / 2.35482); all bands are energy Gaussians. Biaxial entries: o_ray = alpha (E||c), beta_ray =
# beta (E||a), e_ray = gamma (E||b). Spinel is cubic: o_ray and e_ray carry the same set, not pleochroic.
#
# Estimated flag (one rule for every data file): `estimated = true` when the spectrum shape is NOT a measured
# spectrum of that variety, OR the strength is NOT anchored (no concentration, no published color value, a factor
# chosen for how the variety looks). `estimated = false` only for a measured spectrum at a strength that a published
# number fixes. The FIRST line of `sources` is one short plain sentence saying which part is estimated: the UI shows it
# as the "Estimated" tooltip. The full citations follow on the later lines.

data_version = 1

[[variant]]
material = "Sapphire"
key = "sapphire.pink"
label = "Pink"
unit = "per_mm"
reference_path_mm = 7.0
estimated = false
sources = [
  "Dubinsky, Stone-Sundberg & Emmett 2020, G&G 56(1) 2-28, absorption cross-section supplement (data/reference_spectra/gia_dubinsky2020_corundum_six_chromophores_sigma_1nm.csv): Cr3+ cross sections, E perp c and E par c, summed at 100 ppma*cm",
  "GIA Appendix 2 calculated color of Cr3+ at 100 ppma*cm (target anchor)",
]
fit_record = "docs/color_variants/fit_records/corundum_spinel_chrysoberyl.md#sapphire-pink"

  [variant.absorption]
