      { center_nm = 400, width_nm = 1800, peak = 0.400617, shape = "energy" },
      { center_nm = 460, width_nm = 1500, peak = 0.0882254, shape = "energy" },
      { center_nm = 530, width_nm = 1200, peak = 0.0328678, shape = "energy" },
  ]

# Diamond, Brown.
# Brown: the measured decomposition form: a 360 nm Gaussian (vacancy clusters, sigma 3425 cm^-1 = FWHM 1 eV), a 510 nm Gaussian of the same width (patent / NVH0 band; peak ratio 3 : 1) and the ramp c x lambda^-3 (lambda in micrometres, c = 0.08) approximated by three energy Gaussians (centres 284.7 / 385.8 / 496.8 nm; max relative error 0.6 % over 380-700 nm).
# Scale: 360 nm peak 4.23 cm^-1, 510 nm peak 1.41 cm^-1, set so the face-up color over 9.905 mm is a medium brown.
# Face-up color over 9.905 mm (D65): L* 49.70, C* 40.85, h 68.06; target L* 50, C* 40, h 65; dE2000 1.65.
[[variant]]
material = "Diamond"
key = "diamond.brown"
label = "Brown"
unit = "per_mm"
reference_path_mm = 7.0
estimated = true
sources = [
  "Built from published band positions; strength estimated.",
  "Luo et al., Appl. Phys. Lett. 121, 064002 (2022), arXiv:2207.14278 (270 nm Ns0 band: Gaussian, centre 268-272 nm, RMS width 13-27 nm, 4.51 cm^-1 per ppm; brown decomposition: 360 nm Gaussian + 520 nm Gaussian + lambda^-3 ramp)",
  "Eaton-Magana et al., Gems & Gemology Winter 2018 (brown absorption continuum of vacancy clusters, rising toward short wavelengths; https://www.gia.edu/doc/WN18-natural-color-pink-purple-red-brown-diamonds.pdf)",
  "Element Six patent US7910083B2 (band centres 3.54 eV and 2.43 eV, FWHM 1 eV, peaks 1.5-6 and 0.4-2 cm^-1 preferred; ramp c x lambda^-3 with c below 0.2; https://patents.google.com/patent/US7910083B2/en)",
  "Estimated: the natural-stone band heights (the decomposition is measured on CVD material) and the strength (scaled so the face-up color at 7 mm is a medium brown); docs/color_variants/R5_diamond.md and docs/color_variants/R4_quartz_diamond_opal_synthetics_glass.md section 4 (band models)",
]
fit_record = "docs/color_variants/fit_records/diamond.md#brown"

