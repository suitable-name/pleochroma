# Built-in color variants: diamond (cubic, isotropic: o_ray = e_ray, pleochroic = false).
# Schema: see ../color_variants.toml. Research: docs/color_variants/R5_diamond.md (measured parameters)
# and R4 section 4 (band models). Fit records: docs/color_variants/fit_records/diamond.md.
#
# Every entry is estimated = true: no numeric diamond spectrum is published, so the band positions and
# widths are the measured parameters and the strengths are scaled to the face-up color of the named
# grade. Unit per_mm (peak = absorption coefficient in mm^-1 = cm^-1 / 10). The colors were fitted over
# the face-up path of a 7 mm stone, 2.83 model units x 3.5 mm per unit = 9.905 mm (render_setup).
#
# Estimated flag (one rule for every data file): `estimated = true` when the spectrum shape is NOT a measured
# spectrum of that variety, OR the strength is NOT anchored (no concentration, no published color value, a factor
# chosen for how the variety looks). `estimated = false` only for a measured spectrum at a strength that a published
# number fixes. The FIRST line of `sources` is one short plain sentence saying which part is estimated: the UI shows it
# as the "Estimated" tooltip. The full citations follow on the later lines.

data_version = 1

# Diamond, Cape Yellow.
# Cape Yellow: N3 (ZPL 415.2 nm + 370-390 nm vibronic band, peak ratio 2.5 : 1) and N2 (478 nm line, 451-463 nm lump) of type Ia(AB) diamond, plus a 330 nm band for the blue-violet side of the Ia edge.
# Scale: N3 ZPL peak 1.0 cm^-1 (0.10 mm^-1), set so the face-up color over the 9.905 mm path is a light yellow.
# Face-up color over 9.905 mm (D65): L* 99.18, C* 21.94, h 108.15; target L* 98, C* 22, h 103; dE2000 1.97.
[[variant]]
material = "Diamond"
key = "diamond.cape_yellow"
label = "Cape Yellow"
unit = "per_mm"
reference_path_mm = 7.0
estimated = true
sources = [
  "Built from published band positions; strength estimated.",
  "Optics Letters 49(1), 137 (2024), photo-physical characteristics of the N3 center (ZPL 415.2 nm; cross section of the ZPL about 2.5e-15 cm^2, of the 370-390 nm vibronic band about 1e-15 cm^2; https://opg.optica.org/ol/abstract.cfm?uri=ol-49-1-137)",
  "Breeding et al., Gems & Gemology Summer 2020, nitrogen factor in yellow and orange diamonds (N3 415.2 nm, N2 478 nm with 451 and 463 nm lines; https://www.gia.edu/gems-gemology/summer-2020-naturally-colored-yellow-orange-diamonds)",
  "MSA Reviews in Mineralogy and Geochemistry 88 (2022) 637 ff., Diamond Spectroscopy, Defect Centers, Color, and Treatments (https://msaweb.org/wp-content/uploads/2022/07/REV088C12.pdf)",
  "Estimated: the absolute strength (scaled so the face-up color at 7 mm is a light yellow), the N2 height relative to N3, the room-temperature line widths and the 330 nm Ia-edge band; docs/color_variants/R5_diamond.md and docs/color_variants/R4_quartz_diamond_opal_synthetics_glass.md section 4 (band models)",
]
fit_record = "docs/color_variants/fit_records/diamond.md#cape-yellow"

  [variant.absorption]
  pleochroic = false
  o_ray = [
      { center_nm = 415.2, width_nm = 120, peak = 0.1, shape = "energy" },
      { center_nm = 385, width_nm = 1000, peak = 0.04, shape = "energy" },
      { center_nm = 478, width_nm = 150, peak = 0.045, shape = "energy" },
      { center_nm = 450, width_nm = 1100, peak = 0.0375, shape = "energy" },
      { center_nm = 330, width_nm = 3500, peak = 0.06, shape = "energy" },
  ]
  e_ray = [
      { center_nm = 415.2, width_nm = 120, peak = 0.1, shape = "energy" },
      { center_nm = 385, width_nm = 1000, peak = 0.04, shape = "energy" },
      { center_nm = 478, width_nm = 150, peak = 0.045, shape = "energy" },
      { center_nm = 450, width_nm = 1100, peak = 0.0375, shape = "energy" },
      { center_nm = 330, width_nm = 3500, peak = 0.06, shape = "energy" },
  ]

# Diamond, Canary.
# Canary: the measured 270 nm Ns0 band (sigma 2743 cm^-1 = 20 nm, 10 x alpha(425 nm)) and the visible Ns0 continuum alpha(425) exp(-(lambda - 425)/45 nm), four energy Gaussians fitted by relative-error NNLS over 380-560 nm (max error 26 %, the tail beyond 520 nm is under-represented).
# Scale: alpha(425 nm) = 4.28 cm^-1 (alpha(270 nm) = 42.8 cm^-1, about 9.5 ppm Ns0 at 4.51 cm^-1 per ppm), set so the face-up color over 9.905 mm is Fancy Intense to Vivid yellow.
# Face-up color over 9.905 mm (D65): L* 88.55, C* 71.73, h 88.55; target L* 86, C* 72, h 90; dE2000 1.97.
[[variant]]
material = "Diamond"
key = "diamond.canary"
label = "Canary"
unit = "per_mm"
reference_path_mm = 7.0
estimated = true
sources = [
  "Built from published band positions; the visible continuum and the strength are estimated.",
  "Luo et al., Appl. Phys. Lett. 121, 064002 (2022), arXiv:2207.14278 (270 nm Ns0 band: Gaussian, centre 268-272 nm, RMS width 13-27 nm, 4.51 cm^-1 per ppm; brown decomposition: 360 nm Gaussian + 520 nm Gaussian + lambda^-3 ramp)",
  "Breeding et al., Gems & Gemology Summer 2020 (isolated nitrogen Ns0: continuum to about 510 nm gives yellow, to 600 nm orange; https://www.gia.edu/gems-gemology/summer-2020-naturally-colored-yellow-orange-diamonds)",
  "Element Six patent US7910083B2 (alpha(425 nm) / alpha(270 nm) about 0.1, from the ratio of the stated ranges; https://patents.google.com/patent/US7910083B2/en)",
  "Estimated: the visible continuum (exponential, 45 nm e-fold, fitted by four energy Gaussians; R4 gave 60 nm, neither value is measured, alpha(425 nm) = 0.44 mm^-1) and the strength (scaled so the face-up color at 7 mm is Fancy Intense to Vivid yellow); docs/color_variants/R5_diamond.md and docs/color_variants/R4_quartz_diamond_opal_synthetics_glass.md section 4 (band models)",
]
fit_record = "docs/color_variants/fit_records/diamond.md#canary"

  [variant.absorption]
  pleochroic = false
  o_ray = [
      { center_nm = 270, width_nm = 2743, peak = 4.276, shape = "energy" },
      { center_nm = 340, width_nm = 2500, peak = 1.77796, shape = "energy" },
      { center_nm = 400, width_nm = 1800, peak = 0.400617, shape = "energy" },
      { center_nm = 460, width_nm = 1500, peak = 0.0882254, shape = "energy" },
