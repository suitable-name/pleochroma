  "Eaton-Magana et al. 2018: faint colors show only the 550 nm band, fancy and deeper tones add N3 and/or H3 (a weak N3 is included here)",
  "Optics Letters 49(1), 137 (2024), photo-physical characteristics of the N3 center (ZPL 415.2 nm; cross section of the ZPL about 2.5e-15 cm^2, of the 370-390 nm vibronic band about 1e-15 cm^2; https://opg.optica.org/ol/abstract.cfm?uri=ol-49-1-137)",
  "Estimated: the strength (scaled so the face-up color at 7 mm is Fancy Intense pink), the 390 nm companion height (0.15 of the 550 nm peak) and the weak N3 / N2 set (0.6 of the Cape Yellow set); docs/color_variants/R5_diamond.md and docs/color_variants/R4_quartz_diamond_opal_synthetics_glass.md section 4 (band models)",
