# Scale: GR1 band peak 2.14 cm^-1 (about 3.6 ppm V0 at R4's 0.6 cm^-1 per ppm), set so the face-up color over 9.905 mm is Fancy green.
# Face-up color over 9.905 mm (D65): L* 82.00, C* 61.85, h 170.54; target L* 80, C* 58, h 170; dE2000 1.75.
[[variant]]
material = "Diamond"
key = "diamond.green"
label = "Green"
unit = "per_mm"
reference_path_mm = 7.0
estimated = true
sources = [
  "Built from published band positions; strength estimated.",
  "MSA Reviews in Mineralogy and Geochemistry 88 (2022) 637 ff., Diamond Spectroscopy, Defect Centers, Color, and Treatments (https://msaweb.org/wp-content/uploads/2022/07/REV088C12.pdf)",
  "Eaton-Magana et al., Gems & Gemology Summer 2018, natural blue, gray and violet diamonds (https://www.gia.edu/gems-gemology/summer-2018-natural-color-blue-gray-violet-diamonds) (GR1: zero-phonon line 741 nm, vibronic band reaching about 575 nm; N3 and N2 lines in green-blue stones)",
  "Estimated: the GR1 band maximum (620-650 nm range, 640 nm used), its ZPL height (0.8 of the band peak), the blue-side absorption (N3 / N2 set at 2.0 times the Cape Yellow set) and the strength (scaled so the face-up color at 7 mm is Fancy green); docs/color_variants/R5_diamond.md and docs/color_variants/R4_quartz_diamond_opal_synthetics_glass.md section 4 (band models)",
]
