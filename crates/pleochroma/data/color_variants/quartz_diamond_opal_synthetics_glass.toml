# Built-in color variants: quartz, opal, synthetics, glass, rutile (diamond is the lead's).
# Schema: see ../color_variants.toml. Research: docs/color_variants/R4_quartz_diamond_opal_synthetics_glass.md.
# Fit records: docs/color_variants/fit_records/quartz_diamond_opal_synthetics_glass.md (lane F4).
#
# Conventions of this file (every entry): unit per_mm, reference_path_mm 7.0 (a 7 mm stone, whose face-up
# path in the renderer is 9.905 mm = 3.5 mm per model unit x MODEL_UNIT_FACE_UP_PATH 2.83); peaks are the
# Napierian absorption coefficient per millimetre; width_nm is sigma (cm^-1 for energy rows, nm for the one
# wavelength row); keys are <material slug>.<label slug>. An isotropic host (opal, cubic zirconia, YAG,
# glass) stores equal o_ray / e_ray sets with pleochroic = false; a uniaxial host stores o_ray (E perpendicular
# to c) and e_ray (E parallel to c) with pleochroic = true, equal sets where the research shows no visible
# pleochroism (citrine, prasiolite). estimated = true where any part rests on an estimate; entries from
# measured Caltech spectra of both rays (smoky, pink crystalline, opal, rutile brownish red-orange and
# orange) are false.
# DIAMOND: the lead's entries go below (none here).
#
# Estimated flag (one rule for every data file): `estimated = true` when the spectrum shape is NOT a measured
# spectrum of that variety, OR the strength is NOT anchored (no concentration, no published color value, a factor
# chosen for how the variety looks). `estimated = false` only for a measured spectrum at a strength that a published
# number fixes. The FIRST line of `sources` is one short plain sentence saying which part is estimated: the UI shows it
# as the "Estimated" tooltip. The full citations follow on the later lines.

data_version = 1

# Amethyst, Deep Siberian: Fe4+ ([FeO4]0) color center; Anahi o-ray fitted, e-ray from the Report weights, 4.1 x the Anahi density.
[[variant]]
material = "Amethyst"
key = "amethyst.deep_siberian"
label = "Deep Siberian"
unit = "per_mm"
reference_path_mm = 7.0
estimated = true
sources = [
  "o-ray measured (Anahi, Bolivia); e-ray and strength estimated.",
  "o-ray: G. R. Rossman, Caltech Mineral Spectroscopy Server (CC BY-NC 4.0, DOI 10.7907/jywr-qq57), Anahi Mine, Bolivia, 6.17 mm slab, E perpendicular c, http://minerals.gps.caltech.edu/FILES/Visible/quartz/ameth.bo (reference_spectra/variant_amethyst_deep_siberian_eperpc.csv); 4 energy Gaussians fitted, constant baseline 0.217 A removed, rms 0.0041 A",
  "e-ray: no measured spectrum; the o-ray bands times the Report weights 1.0 / 1.0 / 0.7 / 0.5 (UV, violet, 545 nm, 950 nm bands) from docs/chromophores/research-2026-10-polarized-spectra.md (secondary); estimated",
  "Band positions (357, 545, 950 nm): Cox, J. Phys. C 10, 4631 (1977), as quoted in https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7483767/; strength scaled to the face-up target (4.1 x the Anahi density); estimated",
]
fit_record = "docs/color_variants/fit_records/quartz_diamond_opal_synthetics_glass.md#amethyst-deep-siberian"

  [variant.absorption]
  pleochroic = true
  o_ray = [
    { center_nm = 364.3, width_nm = 1914.75, peak = 0.612171, shape = "energy" },
    { center_nm = 416.12, width_nm = 1236.3, peak = 0.162676, shape = "energy" },
    { center_nm = 537.14, width_nm = 2197.48, peak = 0.358664, shape = "energy" },
    { center_nm = 953.79, width_nm = 1304.91, peak = 0.0794293, shape = "energy" },
  ]
  e_ray = [
    { center_nm = 364.3, width_nm = 1914.75, peak = 0.612171, shape = "energy" },
    { center_nm = 416.12, width_nm = 1236.3, peak = 0.162676, shape = "energy" },
