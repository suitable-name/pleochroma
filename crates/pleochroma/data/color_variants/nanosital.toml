  "Absorption range measured (GIA); band shape and strength estimated.",
  "Yellow glass-ceramics absorb strongly from below 400 nm up to about 550 nm; manganese is the cause (Gems & Gemology 62(2), 2026, figure 8D and the discussion, after Bosi et al., American Mineralogist 92, 27 (2007))",
  "Two broad Gaussians stand in for the measured absorption: 380 nm (FWHM 6000 cm^-1, 6.0 cm^-1 per wt% MnO) and 470 nm (FWHM 4500 cm^-1, 1.8 cm^-1 per wt% MnO), at 0.6 wt% MnO for a citrine yellow; estimated",
]
