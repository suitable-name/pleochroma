# Built-in color variants: Nanosital (Si-Al-Mg-Zn glass-ceramic). Schema: see ../color_variants.toml.
# Calibration record: docs/chromophores/calibration-records.md#nanosital.
#
# Primary source of every band position: W. Soonthorntantikul, W. Vertriest, K. Avakyan, "Glass-ceramics as
# imitation gemstones: a study on a silicon-aluminum-magnesium-zinc system", Gems & Gemology 62(2), 164-176
# (Summer 2026), doi 10.5741/GEMS.62.2.164, figure 8 (absorption spectra 300-980 nm by chromophore) and table 1 (dominant
# chromophores by color). GIA publishes the spectra as figures without absorption coefficients, so every strength
# here is an ESTIMATE until calibrated against a measured spectrum.
#
# Conventions of this file (every entry): unit per_mm, reference_path_mm 7.0 (a 7 mm stone, face-up path 9.905 mm);
# peaks are the Napierian absorption coefficient per millimetre; width_nm is sigma in cm^-1 (energy rows, FWHM /
# 2.35482). The host is isotropic, so every entry stores equal o_ray / e_ray sets with pleochroic = false. Each
# colored entry is the recipe of the `nanosital` host of data/chromophores.toml at the amounts named in its sources
# (that host's peak_coeff in cm^-1 per unit, divided by 10 for per mm; an `edge` row becomes the Gaussian the loader
# makes of it). The Material Default (the built-in's own tensor) is the cobalt blue.

data_version = 1

# Nanosital, Ni Green: Ni2+ bands at 598 and 635 nm with the green stones' absorption edge (0.12 wt% NiO).
[[variant]]
material = "Nanosital"
key = "nanosital.ni_green"
label = "Ni Green"
unit = "per_mm"
reference_path_mm = 7.0
estimated = true
sources = [
  "Band positions measured (GIA); widths and strength estimated.",
  "Ni2+ bands at about 598 and 635 nm and an absorption edge between 365 and 445 nm in the green glass-ceramics (Gems & Gemology 62(2), 2026, figure 8B; nickel the dominant chromophore, table 1; GC-12 green, RI 1.618, SG 2.97)",
  "FWHM 3000 cm^-1 per band and 10 cm^-1 per wt% NiO, after the Ni2+ row of the silicate glass host (Report p.29, secondary); the edge (onset 445 nm, 50 cm^-1 per wt% NiO) and the amount 0.12 wt% NiO are chosen for an emerald-to-tsavorite green; estimated",
]
fit_record = "docs/chromophores/calibration-records.md#nanosital"

  [variant.absorption]
  pleochroic = false
  o_ray = [
    { center_nm = 598.0, width_nm = 1273.983, peak = 0.12, shape = "energy" },
    { center_nm = 635.0, width_nm = 1273.983, peak = 0.12, shape = "energy" },
    { center_nm = 417.15, width_nm = 1273.983, peak = 1.2, shape = "energy" },
  ]
  e_ray = [
    { center_nm = 598.0, width_nm = 1273.983, peak = 0.12, shape = "energy" },
    { center_nm = 635.0, width_nm = 1273.983, peak = 0.12, shape = "energy" },
    { center_nm = 417.15, width_nm = 1273.983, peak = 1.2, shape = "energy" },
  ]

