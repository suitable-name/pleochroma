[package]
name = "pleochroma-worker"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
description = "Coordinator and render worker for a pleochroma-backed design catalogue. The default build opens the coordinator window; `--headless serve` runs the coordinator without it: it serves pleochroma-net's read-only design-library protocol to viewers over mutual TLS and accepts joining render workers on a separate worker port. The `worker` feature (on by default through `gui`) adds render capacity -- `join` (dial a coordinator and render its requests), `serve --render` (render with the coordinator's own CPU/GPU) and `render` (a one-shot scene-to-PNG CLI). A headless library-only server is `--no-default-features`."
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = "https://docs.rs/pleochroma-worker"
keywords = ["gemstone", "raytracer", "server", "rendering", "spectral"]
categories = ["command-line-utilities", "network-programming", "rendering"]
publish = { workspace = true }
# Both binaries are declared below; `src/bin/*` is not scanned for a third one.
autobins = false
# `cargo run -p pleochroma-worker` runs the program itself, not the console twin.
default-run = "pleochroma-worker"

[[bin]]
name = "pleochroma-worker"
path = "src/main.rs"

# The console twin of `pleochroma-worker`, a tiny launcher that finds the sibling program,
# runs it with the same arguments and standard streams, waits and returns its exit code.
# Cargo cannot produce a `.com` file: packaging copies this binary's output to the worker's
# own name with `.com` on Windows (`pleochroma-worker.com`; the `build-worker` and
# `windows-console-twins` workflows do it); the launcher starts the `.exe` of its own name.
# It needs no feature and no worker code, so it builds in every configuration.
[[bin]]
name = "pleochroma-worker-console"
path = "src/bin/console.rs"

[dependencies]
# The new-version notice `main.rs` logs first (skipped with `--no-update-check` or
# PLEOCHROMA_NO_UPDATE_CHECK).
pleochroma-update = { workspace = true }
# `pleochroma-vault`'s `Database` methods return `anyhow::Result` -- `crate::serve::library`
# matches on those errors directly (to log the real reason server-side while reporting
# a generic message to the peer -- see that module's doc comment).
anyhow = { workspace = true }
bytemuck = { workspace = true, optional = true }
# Always present: `crate::serve::library` decodes a stored `.asc` attachment with
# `pleochroma_formats::asc::decode_asc_bytes` (many are Windows-1252). Already in the
# graph through `pleochroma-vault`.
pleochroma-formats = { workspace = true }
# Always present: the design library this binary serves. Opened read-only when
# possible (`--db`, or the default `facet_diagrams.sqlite` -- see `crate::serve::library`
# and `pleochroma_vault::db::sqlite::Database::open_read_only`).
pleochroma-vault = { workspace = true }
# `pleochroma-net` already depends on `pleochroma` with the `serde` feature on (for
# `SceneState`'s nested types, gated behind `pleochroma-net`'s own `render` feature); this
# crate also names `pleochroma::` directly (`gpu_backend::GpuBackend`, the CPU tracer's
# `optics::raytracer`, `renderer::buffers::MAX_ABSORPTION_BANDS`), so it needs its own
# dependency line too, not merely a re-export. Beam tracing (retired) is this crate's own `beam`
# feature, not part of this line.
pleochroma = { workspace = true, features = ["serde", "stone-shadow"], optional = true }
# Always present: the wire protocol (library-protocol types are always compiled in;
# `pleochroma-net`'s own `render` feature -- which pulls in `pleochroma`-dependent types like
# `SceneState`/`RenderRequest` -- is turned on only by this crate's `worker` feature
# below, never unconditionally).
pleochroma-net = { workspace = true, features = ["pairing"] }
# `crate::settings`: `coordinator.toml` (serde + toml) and the encrypted settings backup
# (Argon2id key derivation, AES-256-GCM).
serde = { workspace = true }
toml = { workspace = true }
argon2 = "0.5.3"
aes-gcm = "0.10.3"
# Headless `serve`: Ctrl-C and SIGTERM shut the coordinator down cleanly (exit 0).
ctrlc = { version = "3.4", features = ["termination"] }
# The pairing QR code (the window's pairing dialog and `cert issue-token` in a terminal), and
# for the coordinator window (`gui` feature) its clipboard copy
# (kept out of clipboard history and monitoring), and the wizard's folder pickers.
qrcode = { version = "0.14", default-features = false }
arboard = { version = "3.7.0", default-features = false, optional = true }
rfd = { workspace = true, optional = true }
# The coordinator window (`gui` feature). The same features as Pleochroma Cut's window.
slint = { workspace = true, optional = true, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "system-tray"] }
# Durable server jobs (`worker` feature, `crate::jobs`): a stored job IS the desktop render
# queue's `RenderJobFile` (`*.job.json`), and its states and recovery rule are that crate's.
pleochroma-render-jobs = { workspace = true, optional = true }
# Coordinator job execution (`worker` feature): the lane pool, sample cursor, rate
# models and deterministic merge a coordinator fans a viewer's request out with.
pleochroma-dispatch = { workspace = true, optional = true }
glam = { workspace = true, features = ["bytemuck"], optional = true }
image = { workspace = true, features = ["png"], optional = true }
# Decodes a `ClientMessage` (CANCEL or RenderRequest) raw postcard bytes directly in
# `stream_emit::poll_for_client_message`, which already has the payload as a `Vec<u8>`
# (read with its own timeout-tolerant loop) -- `pleochroma_net::messages::read_message` isn't
# reusable there since it reads from a `Read` itself rather than decoding bytes already
# in hand.
postcard = { workspace = true, optional = true }
# `pki` module (the `cert init`/`issue-server`/`issue-client` subcommands) and mutual
# TLS itself: in-process CA/leaf certificate generation and the TLS wrapping every
# accepted connection goes through, regardless of whether this build has render
# capacity -- the library protocol sits behind the exact same authentication as the
# render protocol (see `serve`'s module docs), so these stay unconditional deps, never
# gated by `worker`.
rcgen = { workspace = true }
# `enroll`/`enroll_client` modules: reused here as the CSPRNG source for a fresh 256-bit
# enrollment secret, rather than adding a new randomness dependency.
ring = "0.17.14"
rustls = { workspace = true }
# Scene-file loading for the `render` subcommand only.
serde_json = { workspace = true, optional = true }
# `enroll`/`enroll_client` modules (token-based cert enrollment -- see `enroll.rs`'s
# module doc comment): reused here (and by `crate::serve::library`'s per-design
# content-hash versioning, see that module's own doc comment) to hash the enrollment
# token's bearer secret before it's ever stored.
sha2 = { workspace = true }
# TCP keepalive + TCP_NODELAY tuning for every accepted connection (`crate::serve::run`'s
# accept loop) -- unconditional (not gated by the `worker` feature): the library-only build
# also serves long-lived streamed responses (a large search result, an attachment fetch) that
# benefit equally from detecting a vanished peer and from not paying Nagle's coalescing delay
# on small, latency-sensitive writes.
socket2 = { workspace = true }
# `enroll`/`enroll_client` modules: constant-time secret comparison (already a direct
# dependency of `rustls`).
subtle = "2.6.1"
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `enroll`/`enroll_client` modules: key-material zeroization on drop (already a direct
# dependency of `rustls`).
zeroize = "1.9.1"

# Payload codec measurement only (`examples/payload_codec_bench.rs`). The production
# codecs now live in `pleochroma-net` (`radiance::payload`, behind its default-on
# `compression` feature); the bench keeps its own direct dependency because it also
# measures variants production never sends (unshuffled LZ4/zstd, zstd level 3).
[dev-dependencies]
lz4_flex = "0.14.0"
# `tests/gui_screens.rs`: the coordinator window's screenshots (software renderer).
uiprobe = { workspace = true, features = ["screenshots"] }
zstd = "0.14.3"

# The coordinator window's screenshots (`tests/gui_screens.rs`, written in wave 8).
[[test]]
name = "gui_screens"
path = "tests/gui_screens.rs"
required-features = ["gui"]
# uiprobe needs its own single-threaded main; run it on request:
# `cargo test -p pleochroma-worker --test gui_screens`.
harness = false
test = false

# Renders real FRAME payloads with the production render core (needs `worker`; add
# `gpu` to trace on the adapter).
[[example]]
name = "capture_frame_payloads"
required-features = ["worker"]

# Writes a fixed training `SceneState` to a JSON file -- needs `worker` for
# `pleochroma-net`'s `SceneState`/`render` types. See that example's own doc comment;
# `scripts/pgo-bolt-build.sh`'s BOLT stage is the one caller.
[[example]]
name = "write_pgo_scene"
required-features = ["worker"]

[features]
default = ["gui", "gpu"]
# The render path: `RenderRequest` handling, `stream_emit`, `render_core`, `render_cmd`,
# the `render` subcommand, and `Backend` advertisement in `WELCOME`. On by default through
# `gui`; `--no-default-features` builds the library-only server (see the crate docs on why
# serving the design library is the coordinator's primary role). Turns on `pleochroma-net`'s own `render` feature too, which is what
# actually gates `pleochroma` out of a default build's dependency tree (see that crate's
# `Cargo.toml`) -- without that half, `pleochroma-net` would still pull `pleochroma` in via its
# own unconditional dependency, and this feature alone wouldn't achieve anything.
# `pleochroma/hdr`: decoding the HDR environment maps a viewer sends by content hash
# (`crate::assets`) with the exact decoder the viewer uses.
# A worker build also accepts zoned scenes (it advertises the zoning capability bit and
# handles the separate `ZoningPayload` message).
worker = ["dep:pleochroma", "dep:pleochroma-dispatch", "dep:pleochroma-render-jobs", "dep:glam", "dep:bytemuck", "dep:postcard", "dep:serde_json", "dep:image", "pleochroma/hdr", "pleochroma-net/render"]
# GPU with no render capacity is meaningless, so this implies `worker`. Routes tracing
# through pleochroma's verified GPU megakernel (`pleochroma::renderer::gpu::frame::GpuFrameRenderer`,
# wrapped by this crate's own `gpu_backend::GpuBackend`) for both `render` and `serve`,
# falling back to the CPU tracer per batch whenever the GPU declines (no adapter,
# `--only-cpu`, a scene past the adapter's buffer limits, or a lost device -- see
# `gpu_backend`'s own doc comment; every material is GPU-supported). On by default
# (`default = ["gui", "gpu"]`); a headless server without a GPU adapter can build
# `--no-default-features --features worker` to leave `wgpu`/`pollster` out.
gpu = ["worker", "pleochroma/gpu"]
# Adaptive live passes: `render_core::{live, live_cache}`, the own lane's
# `serve::connection::live_pass` and the coordinator's forwarding relay (`coordinator::live_pass`).
# Parked and off by default: a worker without it answers every `LivePassRequest` with
# `UNSUPPORTED_REQUEST` and keeps the connection, and a coordinator refuses instead of forwarding.
# Implies `worker`; `beam` implies it. Its tests run whenever the feature is on.
adaptive-sampling = ["worker"]
# Beam tiles: `render_core::beam`, the own lane's `serve::connection::beam_tiles` and
# the coordinator's forwarding relay (`coordinator::beam_tiles`). Retired and off by
# default: a worker without it answers every `BeamTileRequest` with `UNSUPPORTED_REQUEST` and keeps the
# connection. Implies `worker`; with `gpu` too the tiles also run on the GPU beam engine. Its tests
# compile only with `RUSTFLAGS="--cfg beam_tests"` (scripts/run_beam_tests.sh).
beam = ["worker", "adaptive-sampling", "pleochroma/beam"]
# The coordinator window (`crate::gui`, `ui/app.slint`), on by default since 0.12.0. Implies
# `worker`. It also makes the Windows build of `pleochroma-worker` a Windows-subsystem program
# (no console; the `pleochroma-worker-console` twin carries the command line). A headless server
# build is `--no-default-features --features worker` (add `gpu` for GPU rendering).
gui = ["worker", "dep:slint", "dep:arboard", "dep:rfd"]

[lints]
workspace = true

[build-dependencies]
# The shared Slint kit and theme (`@pleochroma-kit` imports), as a library path for slint-build.
pleochroma-ui-kit = { workspace = true }
# Unconditional on purpose: a `[target.'cfg(windows)'.build-dependencies]` gate follows
# the platform the build script is evaluated for, so a Windows binary cross-compiled
# from Linux lost its icon. `build.rs` decides at run time from `CARGO_CFG_TARGET_OS`
# whether to embed anything; `winresource` compiles on every host.
winresource = { workspace = true }
# Compiles `ui/app.slint` when the `gui` feature is on (`build.rs` checks `CARGO_FEATURE_GUI`).
# Unconditional: a build script cannot be gated on its own package's features.
slint-build = { workspace = true }
